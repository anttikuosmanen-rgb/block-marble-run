name: Build

# On demand only, on a self-hosted runner on the author's own Mac.
#
# The hosted path is closed rather than merely unconfigured: game-ci/unity-builder runs the editor in
# Docker and needs a licence in the repository secrets, and Unity has retired manual activation for
# Personal licences - the portal now accepts a Plus/Pro serial and nothing else, and a Unity 6
# Personal entitlement has neither a serial nor a .ulf to give it. So there is no licence to put in a
# secret, and no amount of workflow work produces one.
#
# The machine that already has an activated editor builds instead. No secrets, no Docker, no licence
# handling at all - and the workspace persists between runs, so Library/ stays warm without a cache
# step, which was the single biggest cost of the hosted version.
#
# tools/ci-build.sh is the way in: it brings the runner up, dispatches this workflow, streams the
# result and takes the runner down again, so nothing is left listening between builds. Dispatching
# from the Actions tab works too, with the runner started by hand; a run queued while it is down
# simply waits.
#
# The triggers stay manual while the runner is the author's Mac. The repository is public, so a
# workflow that started by itself would run a fork's code on that machine; workflow_dispatch is the
# guard, because only write access can start it.
#
# NOTE: there is no `uses:` anywhere below, and that is deliberate. A self-hosted runner downloads
# every action's tarball from codeload.github.com on every job - hosted runners ship them pre-cached -
# and an afternoon of builds was enough to get this machine's address 429ed, which failed the jobs in
# setup before Unity was ever reached. git does the same work and is already installed.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: What to build
        type: choice
        default: webgl
        options: [webgl, macos, all]
      deploy_pages:
        description: Publish the Pages build to the gh-pages branch
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    # The Mac itself. `unity` is the label that says an activated editor lives here, so a future
    # runner elsewhere does not silently pick up a job it cannot serve.
    runs-on: [self-hosted, macOS, unity]
    strategy:
      fail-fast: false
      # One at a time: they share a machine, a Library folder and a project lock, and Unity will not
      # open the same project twice.
      max-parallel: 1
      matrix:
        include:
          # Self-hosted: server can send Content-Encoding: br, so no JS decompressor ships.
          - name: WebGL (self-host)
            group: webgl
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildWebGLSelfHost
            path: build/webgl-selfhost
          # GitHub Pages cannot set response headers, so the fallback decompressor is required.
          - name: WebGL (Pages)
            group: webgl
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildWebGLPages
            path: build/webgl-pages
            publishes: true
          - name: macOS
            group: macos
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildMacOS
            path: build/macos

    steps:
      - name: Checkout
        run: |
          set -euo pipefail

          # actions/checkout's job, done with git. The workspace persists between runs, so this is a
          # fetch after the first time - which is also what keeps Library/ warm.
          if [ ! -d .git ]; then
            git init -q .
            git remote add origin "https://github.com/$GITHUB_REPOSITORY"
          fi
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
          # Leave build/ and Library/ alone: one is the output, the other is the reason a second
          # build is minutes rather than an hour.
          git clean -qfd -e build -e Library

      - name: Build
        if: inputs.targets == 'all' || inputs.targets == matrix.group
        run: |
          set -euo pipefail

          # Read the editor version from the project rather than pinning it here, so upgrading Unity
          # does not need this file edited as well.
          version=$(awk '/^m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)
          unity="/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/Unity"

          if [ ! -x "$unity" ]; then
            echo "No editor at $unity - install $version through Unity Hub." >&2
            exit 1
          fi

          # -logFile - puts the editor log in the step output, which is the only way to see why a
          # batchmode build failed. -nographics is safe here: nothing renders during a build.
          "$unity" -projectPath "$PWD" -batchmode -nographics -quit \
            -logFile - -executeMethod ${{ matrix.buildMethod }}

      - name: Publish to gh-pages
        if: matrix.publishes && inputs.deploy_pages && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # An orphan commit each time. The branch is a published artifact rather than a history
          # worth keeping, and an accumulating one would carry every past build's 11 MB forever.
          work=$(mktemp -d)
          cp -R "${{ matrix.path }}/." "$work/"
          touch "$work/.nojekyll"   # else Pages drops anything under a leading-underscore path

          cd "$work"
          git init -q -b gh-pages .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build from ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages

          echo "Published: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Where the build went
        if: inputs.targets == 'all' || inputs.targets == matrix.group
        run: |
          echo "${{ matrix.path }}, on the runner:"
          du -sh "${{ matrix.path }}" || true
          echo "No artifact upload - upload-artifact is an action, and downloading actions is what"
          echo "got this machine rate-limited. The output is on the Mac that built it."
