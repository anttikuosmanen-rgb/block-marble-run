name: Build

# On demand only, on a self-hosted runner on the author's own Mac.
#
# The hosted path is closed rather than merely unconfigured: game-ci/unity-builder runs the editor in
# Docker and needs a licence in the repository secrets, and Unity has retired manual activation for
# Personal licences - the portal now accepts a Plus/Pro serial and nothing else, and a Unity 6
# Personal entitlement has neither a serial nor a .ulf to give it. So there is no licence to put in a
# secret, and no amount of workflow work produces one.
#
# The machine that already has an activated editor builds instead. No secrets, no Docker, no licence
# handling at all - and the workspace persists between runs, so Library/ stays warm without a cache
# step, which was the single biggest cost of the hosted version.
#
# Start the runner when you want it, stop it when you are done:
#
#   ~/actions-runner/run.sh          (Ctrl-C to stop; it is not installed as a service)
#
# then Actions -> Build -> Run workflow. A run queued while the runner is down simply waits.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: What to build
        type: choice
        default: webgl
        options: [webgl, macos, all]
      deploy_pages:
        description: Deploy the Pages build afterwards
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    # The Mac itself. `unity` is the label that says an activated editor lives here, so a future
    # runner elsewhere does not silently pick up a job it cannot serve.
    runs-on: [self-hosted, macOS, unity]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-hosted: server can send Content-Encoding: br, so no JS decompressor ships.
          - name: WebGL (self-host)
            group: webgl
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildWebGLSelfHost
            artifact: webgl-selfhost
            path: build/webgl-selfhost
          # GitHub Pages cannot set response headers, so the fallback decompressor is required.
          - name: WebGL (Pages)
            group: webgl
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildWebGLPages
            artifact: webgl-pages
            path: build/webgl-pages
          - name: macOS
            group: macos
            buildMethod: BlockMarbleRun.EditorTools.Bootstrap.BuildScript.BuildMacOS
            artifact: macos
            path: build/macos

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -euo pipefail

          # Read the editor version from the project rather than pinning it here, so upgrading Unity
          # does not need this file edited as well.
          version=$(awk '/^m_EditorVersion:/ { print $2 }' ProjectSettings/ProjectVersion.txt)
          unity="/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/Unity"

          if [ ! -x "$unity" ]; then
            echo "No editor at $unity - install $version through Unity Hub." >&2
            exit 1
          fi

          # -logFile - puts the editor log in the step output, which is the only way to see why a
          # batchmode build failed. -nographics is safe here: nothing renders during a build.
          "$unity" -projectPath "$PWD" -batchmode -nographics -quit \
            -logFile - -executeMethod ${{ matrix.buildMethod }}
        if: inputs.targets == 'all' || inputs.targets == matrix.group

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
        if: inputs.targets == 'all' || inputs.targets == matrix.group

  deploy-pages:
    name: Deploy to Pages
    needs: build
    if: inputs.deploy_pages && github.ref == 'refs/heads/main'
    # Hosted, unlike the build jobs: this one needs the artifact and nothing else, so there is no
    # reason to occupy the Mac with it - and the self-hosted runner downloads every action from
    # codeload on each run, which is what failed here with a 429. Hosted runners have them cached.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webgl-pages
          path: dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
